; 혼디 설정 파일 예시. 설치.bat이 이 파일을 config.ini로 복사합니다. 메모장으로 열어 고치면 됩니다.

[ai]
; openai 또는 none(AI 없이 질문 카드만 사용)
provider = openai
; 기본 모델(입력 100만 토큰당 0.05달러, 출력 0.40달러). 계획 품질이 부족하면 gpt-5-mini로 바꿀 수 있습니다.
model = gpt-5-nano
; OpenAI API 키(sk-...). 화면·기록에는 표시되지 않습니다.
key =
; 계획 수립 시 추론 강도: minimal / low / medium (low 권장)
reasoning_effort = low
price_in_per_mtok_usd = 0.05
price_out_per_mtok_usd = 0.40
usd_krw = 1400
; 이번 달 AI 사용 추정액이 이 금액(원)을 넘으면 AI 호출을 멈추고 질문 카드로 진행합니다.
monthly_limit_krw = 20000

[hub]
; 제주데이터허브 Open API 프로젝트 키(방문 전 미리보기용, 공개 데이터만 조회). 없으면 예시 데이터로 표시합니다.
project_key =

[privacy]
; 반출 기준 충족(초록) 표의 집계값을 AI 해설에 보낼지 여부. 기본 false(센터 심의 전까지 끄는 것을 권장).
send_aggregates = false
; 세션 종료(퇴실) 시 불러온 파일·결과·AI 기록을 지울지 여부. 센터 운영에서는 true 유지.
auto_delete = true
; true이면 세션 종료 시 결과물(out 폴더)만 남깁니다. 보존 필요성과 방식은 운영 매뉴얼 참고.
keep_results = false

[server]
port = 8765
